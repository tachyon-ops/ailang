name: Verify AIL v1.1 Toolchain

# Restricted strictly to manual dispatch so untrusted public PRs/forks
# never execute automatically on the self-hosted workstation runner.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check toolchain availability
        run: |
          uv --version
          python3 --version
          clang --version
          rustc --version
          cargo --version
          node --version
          protoc --version

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run full pytest suite
        run: uv run pytest -v

      - name: Smoke-check CLI verification, fuzzing, multi-target build & static export
        run: |
          uv run ail stdlib
          uv run ail check examples/sum_type_settlement.ail
          uv run ail audit-spec examples/sum_type_settlement.ail
          uv run ail check examples/wire_frame_parser.ail
          uv run ail check examples/defi_waterfall_v1.ail
          uv run ail check examples/wire_codec_v1_1.ail
          uv run ail audit-spec examples/wire_codec_v1_1.ail
          uv run ail fuzz examples/wire_codec_v1_1.ail -o build/ci_fuzz --cases 25
          uv run ail build --target all examples/sum_type_settlement.ail -o build/ci_settlement
          uv run ail build --target all examples/wire_frame_parser.ail -o build/ci_wire
          uv run ail build --target all examples/wire_codec_v1_1.ail -o build/ci_wire_v1_1
          uv run ail studio --export-static build/ci_site

      - name: Run dogfood-gateway Cargo tests
        run: cargo test --manifest-path integrations/dogfood-gateway/Cargo.toml
